<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Viraj Mahesh - Group Product Manager at YouTube, UC Berkeley graduate"
    />
    <meta name="author" content="Viraj Mahesh" />
    <title>Viraj Mahesh</title>
    <link rel="preload" href="assets/fonts/inter-tight-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/inter-tight-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter Tight";
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-tight-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter Tight";
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/inter-tight-700.woff2") format("woff2");
      }
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 48px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d9d6cf;
        color: #18181b;
        font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      a {
        color: #3f3f46;
        text-decoration: none;
      }
      a:hover {
        color: #000;
        text-decoration: underline;
      }
      /* The wrapper is the size container so cqi units inside the card
         resolve against the card's width, not the viewport. */
      .wrap {
        width: min(100%, 35rem);
        container-type: inline-size;
      }
      .card {
        aspect-ratio: 7 / 4;
        box-sizing: border-box;
        background: #fdfcfa;
        border-radius: 6px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.06), 0 18px 40px rgba(40, 30, 10, 0.18);
        padding: 6cqi 7cqi;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 4cqi;
      }
      .head {
        display: flex;
        flex-direction: column;
        gap: 1.2cqi;
      }
      h1 {
        margin: 0;
        font-size: max(24px, 7cqi);
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .role {
        margin: 0;
        font-size: max(14px, 3.4cqi);
        color: #52525b;
      }
      nav {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.6cqi;
        font-size: max(13px, 3cqi);
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
    <main class="card">
      <div class="head">
        <h1>Viraj Mahesh</h1>
        <p class="role">Group Product Manager, YouTube</p>
      </div>
      <nav aria-label="Contact">
        <a href="mailto:virajmahesh@gmail.com">virajmahesh@gmail.com</a>
        <a href="https://linkedin.com/in/virajmahesh">linkedin.com/in/virajmahesh</a>
        <a href="https://github.com/virajmahesh">github.com/virajmahesh</a>
        <a href="assets/resume.pdf">Resume</a>
      </nav>
    </main>
    </div>
  </body>
</html>
